<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Notas e Média</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <h1>Digite as notas:</h1>
    <div class="notas-container">
      <input type="number" class="nota" placeholder="1ª nota" min="0" max="10" step="0.01" />
      <input type="number" class="nota" placeholder="2ª nota" min="0" max="10" step="0.01" />
      <input type="number" class="nota" placeholder="3ª nota" min="0" max="10" step="0.01" />
    </div>

    <ul id="listaNotas"></ul>

    <div class="media-final-container">
      <h2 id="mediaTitulo">Média final</h2>
      <span id="mediaNumero">0.00</span>
    </div>
    <p id="statusAluno"></p>
  </div>

  <script src="script.js"></script>
</body>
</html>
